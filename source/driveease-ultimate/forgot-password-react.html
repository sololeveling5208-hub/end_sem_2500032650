<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#171b21"><title>DriveEase | Password Recovery</title><link rel="stylesheet" href="style.css"><style>
.recovery-shell{min-height:100vh;background:radial-gradient(circle at 80% 10%,#343b45 0,#171b21 42%,#10151d 100%);padding:35px 18px;display:grid;place-items:center}.recovery-card{width:min(100%,520px);background:#fffdf8;border:1px solid #e7dfd2;border-radius:22px;box-shadow:0 30px 90px #0005;padding:34px}.recovery-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}.recovery-brand{display:flex;gap:10px;align-items:center;color:#20231f;font:800 17px Manrope,sans-serif;text-decoration:none}.recovery-brand .brand-mark{background:#c7a76c;color:#171b21}.back-link{color:#85704e;font-size:11px;font-weight:800;text-decoration:none}.recovery-kicker{font-size:9px;letter-spacing:2px;color:#997542;font-weight:800;margin:0 0 11px}.recovery-card h1{font:800 31px/1.15 Manrope,sans-serif;letter-spacing:-1.2px;color:#20231f;margin:0 0 12px}.recovery-sub{font-size:12px;color:#77766f;line-height:1.8;margin:0 0 25px}.recovery-field{display:block;margin:15px 0}.recovery-field label{display:block;font-size:10px;font-weight:800;color:#5f5d56;margin-bottom:7px}.recovery-field input{width:100%;height:47px;padding:0 13px;border:1px solid #e3dbce;border-radius:9px;background:white;outline:none}.recovery-field input:focus{border-color:#b99a62;box-shadow:0 0 0 3px #b99a6220}.recovery-btn{width:100%;height:46px;border:0;border-radius:9px;background:#20252d;color:#fff;font-weight:800;cursor:pointer;margin-top:7px}.recovery-btn:hover{background:#353b44}.recovery-error{font-size:11px;line-height:1.6;color:#b43d42;margin:12px 0}.recovery-note{margin-top:20px;padding:12px 14px;border-radius:10px;background:#f4ecdd;color:#786744;font-size:10px;line-height:1.75}.recovery-progress{display:flex;gap:7px;margin-bottom:27px}.recovery-progress span{height:4px;flex:1;background:#e8e0d3;border-radius:9px}.recovery-progress span.active{background:#c7a76c}.recovery-success{background:#e9f4ec;border:1px solid #cfe5d5;color:#27633a;border-radius:10px;padding:12px;font-size:11px;line-height:1.6;margin:12px 0}.recovery-code{padding:12px;text-align:center;border:1px dashed #c8ad7b;border-radius:9px;font:800 24px Manrope,sans-serif;letter-spacing:7px;color:#735629;background:#faf5e9;margin:13px 0}.recovery-small{font-size:10px;color:#77766f;line-height:1.6}.recovery-footer{text-align:center;color:#aeb2b8;font-size:10px;margin-top:22px}
</style></head><body><div class="recovery-shell"><div id="recoveryRoot" style="width:100%"></div></div><script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">
const {useState}=React;
function RecoveryApp(){
 const [step,setStep]=useState(1),[email,setEmail]=useState(""),[code,setCode]=useState(""),[sentCode,setSentCode]=useState(""),[password,setPassword]=useState(""),[confirm,setConfirm]=useState(""),[error,setError]=useState(""),[success,setSuccess]=useState(""),[demoUser,setDemoUser]=useState(null);
 const goBack=()=>window.location.href="index.html";
 const getUsers=()=>{try{return JSON.parse(localStorage.getItem("driveease_users_v2")||"[]")}catch{return []}};
 function requestCode(e){e.preventDefault();setError("");setSuccess("");const found=getUsers().find(u=>u.email?.toLowerCase()===email.trim().toLowerCase()&&u.role!=="admin");if(!found){setError("We couldn't find a customer account with that email in this browser's demo storage.");return}const newCode=String(Math.floor(100000+Math.random()*900000));setSentCode(newCode);setDemoUser(found);setStep(2);setSuccess("Demo verification code created. No email has been sent.");}
 function verifyCode(e){e.preventDefault();setError("");if(code.trim()!==sentCode){setError("That code doesn't match. Check the demo code shown below.");return}setStep(3);setSuccess("");}
 function resetPassword(e){e.preventDefault();setError("");if(password.length<6){setError("Use at least 6 characters for this demo password.");return}if(password!==confirm){setError("The passwords don't match.");return}const users=getUsers();const idx=users.findIndex(u=>u.email?.toLowerCase()===email.trim().toLowerCase()&&u.role!=="admin");if(idx<0){setError("The account could not be found. Please start again.");return}users[idx].password=password;localStorage.setItem("driveease_users_v2",JSON.stringify(users));setStep(4);setSuccess("Password updated in this browser's demo account. Return to DriveEase and log in with your new password.");}
 return <div className="recovery-card"><div className="recovery-top"><a href="index.html" className="recovery-brand"><span className="brand-mark">D</span><span>DriveEase</span></a><a href="index.html" className="back-link">← Back to website</a></div><div className="recovery-progress"><span className={step>=1?"active":""}></span><span className={step>=2?"active":""}></span><span className={step>=3?"active":""}></span></div><p className="recovery-kicker">ACCOUNT ASSISTANCE</p>
 {step===1&&<><h1>Forgot your password?</h1><p className="recovery-sub">Enter the email associated with your DriveEase customer account to begin the password recovery demonstration.</p><form onSubmit={requestCode}><div className="recovery-field"><label htmlFor="email">Registered email</label><input id="email" type="email" required autoComplete="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>{error&&<p className="recovery-error">{error}</p>}<button className="recovery-btn">Continue <span>→</span></button></form></>}
 {step===2&&<><h1>Verify your account</h1><p className="recovery-sub">A real application would email a time-limited code to <strong>{email}</strong>. For this classroom demo, the code is displayed here.</p>{success&&<p className="recovery-success">{success}</p>}<div className="recovery-code">{sentCode}</div><form onSubmit={verifyCode}><div className="recovery-field"><label htmlFor="code">Verification code</label><input id="code" inputMode="numeric" pattern="[0-9]{6}" maxLength="6" required placeholder="Enter 6-digit code" value={code} onChange={e=>setCode(e.target.value)}/></div>{error&&<p className="recovery-error">{error}</p>}<button className="recovery-btn">Verify code <span>→</span></button></form><p className="recovery-small" style={{marginTop:14}}><button type="button" className="text-button" onClick={()=>{setStep(1);setError("");setSuccess("")}}>Use a different email</button></p></>}
 {step===3&&<><h1>Create a new password</h1><p className="recovery-sub">Choose a new password for <strong>{email}</strong>.</p><form onSubmit={resetPassword}><div className="recovery-field"><label htmlFor="newpass">New password</label><input id="newpass" type="password" minLength="6" required autoComplete="new-password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="At least 6 characters"/></div><div className="recovery-field"><label htmlFor="confirm">Confirm new password</label><input id="confirm" type="password" minLength="6" required autoComplete="new-password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="Enter it again"/></div>{error&&<p className="recovery-error">{error}</p>}<button className="recovery-btn">Save new password <span>→</span></button></form></>}
 {step===4&&<><div className="step-icon" style={{marginBottom:18}}>✓</div><h1>Password updated</h1><p className="recovery-sub">Your password has been updated in the local classroom demo.</p>{success&&<p className="recovery-success">{success}</p>}<button className="recovery-btn" onClick={goBack}>Return to login <span>→</span></button></>}
 <div className="recovery-note"><strong>Classroom prototype only.</strong> This page uses React for the interface, but the code is generated locally and shown on screen. It does not send email. The password is stored in Local Storage and this is <strong>not secure authentication</strong>. A real service needs a backend/auth provider and a single-use, expiring reset token.</div><div className="recovery-footer">DRIVEEASE · PASSWORD RECOVERY DEMO</div></div>
}
ReactDOM.createRoot(document.getElementById("recoveryRoot")).render(<RecoveryApp/>);
</script></body></html>
