<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <p class="subtitle">Enter student details and calculate grades</p>

        <div class="form">
            <input id="name" placeholder="Student Name">
            <input id="m1" type="number" placeholder="M1 Marks (0-100)">
            <input id="m2" type="number" placeholder="M2 Marks (0-100)">
            <input id="m3" type="number" placeholder="M3 Marks (0-100)">
            <button onclick="addStudent()">Add Student</button>
        </div>

        <h2>Student Records</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>M1</th>
                    <th>M2</th>
                    <th>M3</th>
                    <th>Total</th>
                    <th>Average</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
